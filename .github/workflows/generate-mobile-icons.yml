name: Generate mobile app icons
on:
  push:
    paths:
      - 'logo.svg'
      - '.github/workflows/generate-mobile-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG renderer
        run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render Android and iPhone icons
        run: |
          python - <<'PY'
          import cairosvg
          for size in (180, 192, 512):
              output = f'icons/icon-{size}.png' if size != 180 else 'icons/apple-touch-icon.png'
              cairosvg.svg2png(url='logo.svg', write_to=output, output_width=size, output_height=size)
              print(output)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png
          git diff --cached --quiet || (git commit -m "Update Android and iOS PWA icons to full MBD logo" && git push)
